name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS so the shared tests also run on the iOS simulator.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests (Android JVM + iOS simulator), app build, lint
        run: ./gradlew :shared:allTests :androidApp:assembleDebug :androidApp:lintDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            shared/build/reports
            androidApp/build/reports
